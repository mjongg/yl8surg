  table { border-collapse: collapse; font-size: 11px; width: 100%; min-width: 1200px; zoom: 0.8; }
  th, td { border: 1px solid #d5dce4; padding: 4px 2px; text-align: center; word-wrap: break-word; }

  .name-cell { text-align: left !important; font-weight: 600; background: #f7f9fb !important; width: 200px; position: sticky; left: 0; z-index: 1; border-right: 2px solid #bcc8d4; padding-left: 6px; white-space: nowrap; }
  tr.group-end td { border-bottom: 3px solid #7f8c8d; }

  /* Calendar View */

  .personal-view.active { display: block; }
  
  .week-grid {
    display: grid; grid-template-columns: 50px repeat(7, 1fr); gap: 2px;
    background: #e1e8ed; border: 1px solid #d5dce4; border-radius: 8px; overflow: hidden; margin-bottom: 24px;

  .time-axis { background: #f8f9fa; display: flex; flex-direction: column; }

  .day-col { background: #fff; position: relative; }
  /* Hour lines */
  .hour-line { position: absolute; left: 0; right: 0; height: 1px; background: #f0f2f5; }

  /* Event Blocks */
  .event-block {
    position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 6px 8px;
    font-size: 11px; font-weight: 700; line-height: 1.3; overflow: hidden;

  .event-time { font-size: 9.5px; opacity: 0.8; font-weight: 600; margin-top: 2px; }

  @media (max-width: 800px) { .week-grid { grid-template-columns: 40px repeat(7, 1fr); } .event-block { font-size: 9px; padding: 4px; } }

function formatTime(s, e) {
  let sh = s % 24; let eh = e % 24;
  let sp = sh>=12 ? (sh===12?12:sh-12)+'pm' : (sh===0?12:sh)+'am';
  let ep = eh>=12 ? (eh===12?12:eh-12)+'pm' : (eh===0?12:eh)+'am';
  return sp + " - " + ep;
}

function downloadICS(name) {
  const tmcIndex = masterPeople.indexOf(name);
  let eamcEvts = getAbsoluteEvents(eamcSchedule[name], parseEamcLogic);
  let tmcEvts = getAbsoluteEvents(tmcGrid[tmcIndex], parseTmcLogic);
  
  let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Surgery Rotation//EN\n";
  
  function addEvents(evts, baseDateStr, prefix) {
    let baseDate = new Date(baseDateStr);
    for (let e of evts) {
      if (e.title.includes("OFF") || e.title === "OFF" || e.title.includes("TRUE FROM")) continue; 
      
      let start = new Date(baseDate.getTime() + e.s * 3600000);
      let end = new Date(baseDate.getTime() + e.e * 3600000);
      
      let format = (d) => {
        let y = d.getFullYear();
        let m = String(d.getMonth()+1).padStart(2,'0');
        let day = String(d.getDate()).padStart(2,'0');
        let h = String(d.getHours()).padStart(2,'0');
        let min = String(d.getMinutes()).padStart(2,'0');
        let s = String(d.getSeconds()).padStart(2,'0');
        return `${y}${m}${day}T${h}${min}${s}`;
      };
      
      ics += "BEGIN:VEVENT\n";
      ics += `UID:${Math.random().toString(36).substring(2)}@surgery\n`;
      ics += `DTSTAMP:${format(new Date())}\n`;
      ics += `DTSTART:${format(start)}\n`;
      ics += `DTEND:${format(end)}\n`;
      ics += `SUMMARY:${prefix} ${e.title}\n`;
      ics += "END:VEVENT\n";
    }
  }
  
  addEvents(eamcEvts, "2026-07-27T00:00:00", "[EAMC]");
  addEvents(tmcEvts, "2026-08-10T00:00:00", "[TMC]");
  
  ics += "END:VCALENDAR";
  
  let blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  let link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${name.replace(/\s+/g, '_')}_Surgery_Schedule.ics`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function getAbsoluteEvents(schedArr, parseLogic) {
  let allEvents = [];
  for(let d=0; d<14; d++) {
    let dayEvents = parseLogic(schedArr[d], dows[d], d);
    allEvents.push(...dayEvents);
  }
  return allEvents;
}

function parseEamcLogic(shift, dow, dayIndex) {
  let evts = [];
  let baseHour = dayIndex * 24;
  
  if (shift.includes("Breast Care")) {
    if (dow === "Sat" || dow === "Sun") evts.push({ title: "ER (from Breast Care)", s: baseHour + 7, e: baseHour + 19, c: getEamcStyle("ER Pre") });
    else evts.push({ title: shift, s: baseHour + 8, e: baseHour + 17, c: getEamcStyle("Breast Care") });
  } else if (shift.includes("OPD")) {
    if (dow === "Sat") {
      evts.push({ title: "OPD", s: baseHour + 8, e: baseHour + 12, c: getEamcStyle("OPD") });
      evts.push({ title: "WARD/OR", s: baseHour + 12, e: baseHour + 19, c: getEamcStyle("Ward/OR Pre") });
    } else if (dow === "Sun") {
      evts.push({ title: "WARD/OR", s: baseHour + 7, e: baseHour + 19, c: getEamcStyle("Ward/OR Pre") });
    } else {
      evts.push({ title: shift, s: baseHour + 8, e: baseHour + 17, c: getEamcStyle("OPD") });
    }
  } else if (shift === "SGD then Off") {
    evts.push({ title: "SGD/Conference", s: baseHour + 7, e: baseHour + 12, c: getEamcStyle(shift) });
  } else if (shift === "Off") {
    // Just a marker block to signify OFF day
    evts.push({ title: "TRUE FROM (OFF)", s: baseHour + 7, e: baseHour + 17, c: "background:#fff; color:#555; border-color:#bdc3c7;" });
  } else if (shift.includes("Duty") || shift.includes("- until 1 AM")) {
    evts.push({ title: shift, s: baseHour + 19, e: baseHour + 31, c: getEamcStyle(shift) }); // 7 PM to 7 AM next day
  } else {
    evts.push({ title: shift, s: baseHour + 7, e: baseHour + 19, c: getEamcStyle(shift) }); // Pre-duties
  }
  return evts;
}

function parseTmcLogic(shift, dow, dayIndex) {
  let evts = [];
  let baseHour = dayIndex * 24;
  if (shift.startsWith("AM") || shift === "ANES") {
    evts.push({ title: shift, s: baseHour + 7, e: baseHour + 19, c: getTmcStyle(shift) });
  } else if (shift.startsWith("PM")) {
    evts.push({ title: shift, s: baseHour + 19, e: baseHour + 31, c: getTmcStyle(shift) });
  } else {
    evts.push({ title: "OFF", s: baseHour + 7, e: baseHour + 17, c: "background:#fff; color:#555; border-color:#bdc3c7;" });
  }
  return evts;
}

function renderWeek(title, dates, dowArr, allEvents, weekStartIndex) {
  let html = `<div class="week-grid"><div class="week-title">${title}</div><div class="time-axis"><div class="cal-header">Time</div>`;
  for(let i=0;i<24;i++) {
    let ampm = i>=12 ? (i===12?12:i-12)+' PM' : (i===0?12:i)+' AM';
    html += `<div class="time-slot">${ampm}</div>`;
  }
  html += `</div>`;
  
  for(let d=0;d<7;d++) {
    let globalDayIndex = weekStartIndex + d;
    let dayStartHour = globalDayIndex * 24;
    let dayEndHour = dayStartHour + 24;

    html += `<div class="day-col"><div class="cal-header">${dowArr[d]}<br><span style="font-size:10px;font-weight:400">${dates[d]}</span></div>`;
    for(let i=0;i<=24;i++) html += `<div class="hour-line" style="top:${(i/24)*100}%;"></div>`;
    html += `<div style="height:720px; position:relative;">`;
    
    // Filter events overlapping this specific 12AM-12AM day window
    for(let e of allEvents) {
      let overlapStart = Math.max(e.s, dayStartHour);
      let overlapEnd = Math.min(e.e, dayEndHour);
      
      if(overlapStart < overlapEnd) {
        let top = ((overlapStart - dayStartHour) / 24) * 100;
        let height = ((overlapEnd - overlapStart) / 24) * 100;
        html += `<div class="event-block" style="top:${top}%; height:${height}%; ${e.c}">
                   ${e.title}<div class="event-time">${formatTime(overlapStart, overlapEnd)}</div>
                 </div>`;
      }
    }
    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

function renderApp() {
  const sel = document.getElementById("namePicker").value;
  if (sel === "ALL") {
    document.getElementById("personalView").classList.remove("active");
    document.getElementById("masterViewWrap").style.display = "block";
    document.getElementById("mainTabs").style.display = "flex";
    buildMasters();
    setTab(currentTab);
  } else {
    document.getElementById("masterViewWrap").style.display = "none";
    document.getElementById("mainTabs").style.display = "none";
    document.getElementById("personalView").classList.add("active");
    buildPersonal(sel);
  }
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('active');
    if (b.innerText.toLowerCase().includes(tab)) b.classList.add('active');
  });
  document.getElementById("eamcMaster").style.display = tab==='eamc'?'block':'none';
  document.getElementById("tmcMaster").style.display = tab==='tmc'?'block':'none';
}

function buildMasters() {
  let h = '<thead><tr><th class="name-cell">EAMC</th>';
  for(let i=0;i<14;i++) h+=`<th>${eamcDates[i]}<br>${dows[i]}</th>`;
  h+='</tr></thead><tbody>';
  for(let p=0;p<15;p++) {
    const name = eamcGroupedPeople[p];
    h+=`<tr class="${p%5===4?'group-end':''}"><td class="name-cell">${p+1}. ${name}</td>`;
    for(let d=0;d<14;d++) h+=`<td style="${getEamcStyle(eamcSchedule[name][d])}">${eamcSchedule[name][d]}</td>`;
    h+='</tr>';
  }
  h+='</tbody>'; document.getElementById("eamcTable").innerHTML = h;

  let th = '<thead><tr><th class="name-cell">TMC</th>';
  for(let i=0;i<14;i++) th+=`<th>${tmcDates[i]}<br>${dows[i]}</th>`;
  th+='</tr></thead><tbody>';
  for(let p=0;p<15;p++) {
    const name = masterPeople[p];
    th+=`<tr><td class="name-cell">${p+1}. ${name}</td>`;
    for(let d=0;d<14;d++) th+=`<td style="${getTmcStyle(tmcGrid[p][d])}">${tmcGrid[p][d]}</td>`;
    th+='</tr>';
  }
  th+='</tbody>'; document.getElementById("tmcTable").innerHTML = th;
}

renderApp();
</script>
